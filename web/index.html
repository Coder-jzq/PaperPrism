<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#fff7fb"
    />

    <meta
      name="description"
      content="Paper Daily - 自动追踪、阅读并精选与你研究方向相关的最新论文"
    />

    <title>Paper Daily</title>

    <!--
      修改版本号用于避免 GitHub Pages / 浏览器继续读取旧 CSS。
    -->
    <link
      rel="stylesheet"
      href="./styles.css?v=20260909-paper-reader-v3"
    />
  </head>

  <body data-theme="pink">

    <!-- =====================================================
         Top Navigation
         ===================================================== -->

    <header class="topbar">

      <!-- Brand -->
      <div class="brand">

        <span
          class="brand-mark"
          aria-hidden="true"
        >
          PD
        </span>

        <div class="brand-text">

          <h1>
            Paper Daily
          </h1>

          <p id="updatedAt">
            正在读取数据
          </p>

        </div>

      </div>


      <!-- Actions -->
      <nav
        class="top-actions"
        aria-label="页面操作"
      >

        <!-- ===============================================
             Theme Switcher
             =============================================== -->

        <div
          class="theme-switcher"
          role="radiogroup"
          aria-label="选择网站背景主题"
        >

          <!-- Pink -->
          <button
            class="theme-option active"
            type="button"
            role="radio"
            aria-checked="true"
            data-theme-option="pink"
            title="粉白主题"
          >
            <span
              class="theme-swatch pink-swatch"
              aria-hidden="true"
            ></span>

            <span>
              粉白
            </span>
          </button>


          <!-- Light -->
          <button
            class="theme-option"
            type="button"
            role="radio"
            aria-checked="false"
            data-theme-option="light"
            title="淡色主题"
          >
            <span
              class="theme-swatch light-swatch"
              aria-hidden="true"
            ></span>

            <span>
              淡色
            </span>
          </button>


          <!-- Dark -->
          <button
            class="theme-option"
            type="button"
            role="radio"
            aria-checked="false"
            data-theme-option="dark"
            title="深色主题"
          >
            <span
              class="theme-swatch dark-swatch"
              aria-hidden="true"
            ></span>

            <span>
              深色
            </span>
          </button>


          <!-- Eye Care -->
          <button
            class="theme-option"
            type="button"
            role="radio"
            aria-checked="false"
            data-theme-option="eye"
            title="护眼主题"
          >
            <span
              class="theme-swatch eye-swatch"
              aria-hidden="true"
            ></span>

            <span>
              护眼
            </span>
          </button>

        </div>


        <!-- Research Interests -->
        <a
          class="icon-link"
          href="https://github.com/Coder-jzq/paper-daily/issues"
          target="_blank"
          rel="noreferrer"
          title="配置研究方向"
          aria-label="配置研究方向"
        >
          ⚙
        </a>


        <!-- GitHub Actions -->
        <a
          class="icon-link"
          href="https://github.com/Coder-jzq/paper-daily/actions"
          target="_blank"
          rel="noreferrer"
          title="查看更新任务"
          aria-label="查看更新任务"
        >
          ↻
        </a>

      </nav>

    </header>


    <!-- =====================================================
         Main
         ===================================================== -->

    <main class="shell">


      <!-- ===================================================
           Overview
           =================================================== -->

      <section
        class="overview"
        aria-label="概览"
      >

        <!-- Main Overview Card -->
        <div class="overview-title">

          <p>
            Research Radar
          </p>

          <h2 id="viewTitle">
            个人论文阅读工作台
          </h2>

          <p class="overview-subtitle">
            新论文进入未读列表；已读与精选状态仅保存在当前浏览器中。
          </p>

        </div>


        <!-- Statistics -->
        <div class="metric-grid">

          <!-- Total Papers -->
          <div class="metric">

            <span
              class="metric-value"
              id="paperCount"
            >
              0
            </span>

            <span class="metric-label">
              总论文
            </span>

          </div>


          <!-- Weekly -->
          <div class="metric">

            <span
              class="metric-value"
              id="weekCount"
            >
              0
            </span>

            <span class="metric-label">
              本周新增
            </span>

          </div>


          <!-- Monthly -->
          <div class="metric">

            <span
              class="metric-value"
              id="monthCount"
            >
              0
            </span>

            <span class="metric-label">
              本月新增
            </span>

          </div>


          <!-- Highest Match -->
          <div class="metric accent">

            <span
              class="metric-value"
              id="topScore"
            >
              0.00
            </span>

            <span class="metric-label">
              最高匹配
            </span>

          </div>

        </div>

      </section>


      <!-- ===================================================
           Reading State Navigation
           =================================================== -->

      <section
        class="reading-nav-wrap"
        aria-label="阅读状态"
      >

        <div
          class="reading-tabs"
          role="tablist"
          aria-label="未读、已读和精选"
        >

          <button
            class="reading-tab active"
            type="button"
            role="tab"
            aria-selected="true"
            data-reading-state="unread"
          >
            <span
              class="reading-tab-icon"
              aria-hidden="true"
            >
              ◌
            </span>

            <span class="reading-tab-text">
              未读
            </span>

            <span
              class="reading-tab-count"
              id="unreadCount"
            >
              0
            </span>
          </button>


          <button
            class="reading-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-reading-state="read"
          >
            <span
              class="reading-tab-icon"
              aria-hidden="true"
            >
              ✓
            </span>

            <span class="reading-tab-text">
              已读
            </span>

            <span
              class="reading-tab-count"
              id="readCount"
            >
              0
            </span>
          </button>


          <button
            class="reading-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-reading-state="favorite"
          >
            <span
              class="reading-tab-icon"
              aria-hidden="true"
            >
              ★
            </span>

            <span class="reading-tab-text">
              精选
            </span>

            <span
              class="reading-tab-count"
              id="favoriteCount"
            >
              0
            </span>
          </button>

        </div>


        <div
          class="local-state-note"
          title="阅读状态保存在浏览器 localStorage 中，不会上传到服务器。"
        >
          <span aria-hidden="true">
            ⌁
          </span>
          本地阅读记录
        </div>

      </section>


      <!-- ===================================================
           Toolbar / Filter
           =================================================== -->

      <section
        class="toolbar"
        aria-label="筛选"
      >


        <!-- Collection -->
        <div
          class="collection-tabs"
          role="tablist"
          aria-label="论文集合"
        >

          <button
            class="collection-tab active"
            type="button"
            data-collection="daily"
          >
            每日新论文
          </button>

          <button
            class="collection-tab"
            type="button"
            data-collection="conference"
          >
            顶会精品
          </button>

        </div>


        <!-- Time View -->
        <div
          class="tabs"
          role="tablist"
          aria-label="时间范围"
        >

          <button
            class="tab"
            type="button"
            data-view="all"
          >
            全部
          </button>

          <button
            class="tab active"
            type="button"
            data-view="daily"
          >
            当日
          </button>

          <button
            class="tab"
            type="button"
            data-view="week"
          >
            本周
          </button>

          <button
            class="tab"
            type="button"
            data-view="month"
          >
            本月
          </button>

        </div>


        <!-- Filters -->
        <div class="filters">


          <!-- Date -->
          <label class="field compact">

            <span>
              日期
            </span>

            <select
              id="dateFilter"
              aria-label="选择日期"
            ></select>

          </label>


          <!-- Topic -->
          <label class="field">

            <span>
              方向
            </span>

            <select
              id="topicFilter"
              aria-label="选择研究方向"
            ></select>

          </label>


          <!-- Match Level -->
          <label class="field">

            <span>
              匹配
            </span>

            <select
              id="levelFilter"
              aria-label="选择匹配程度"
            >

              <option value="all">
                全部
              </option>

              <option value="high">
                High
              </option>

              <option value="medium">
                Medium
              </option>

              <option value="low">
                Low
              </option>

            </select>

          </label>


          <!-- Search -->
          <label class="field search">

            <span>
              搜索
            </span>

            <input
              id="searchInput"
              type="search"
              placeholder="标题、作者、关键词"
              autocomplete="off"
              aria-label="搜索论文"
            />

          </label>

        </div>

      </section>


      <!-- ===================================================
           Content
           =================================================== -->

      <section class="content">


        <!-- Content Header -->
        <div class="content-head">

          <div>

            <h2 id="listTitle">
              未读论文
            </h2>

            <p id="scopeLabel">
              -
            </p>

          </div>


          <span
            id="resultCount"
            class="result-count"
          >
            0 篇
          </span>

        </div>


        <!-- Empty State -->
        <div
          id="emptyState"
          class="empty-state"
          hidden
        >
          <div
            class="empty-state-icon"
            aria-hidden="true"
          >
            ◌
          </div>

          <h3 id="emptyStateTitle">
            这里暂时没有论文
          </h3>

          <p id="emptyStateText">
            新论文会自动出现在这里。
          </p>
        </div>


        <!-- Paper List -->
        <div
          id="paperList"
          class="paper-list"
        ></div>

      </section>

    </main>


    <!-- =====================================================
         Paper Template
         ===================================================== -->

    <template id="paperTemplate">

      <article class="paper-card">


        <!-- Main -->
        <div class="paper-main">


          <!-- Metadata -->
          <div class="paper-meta">

            <span class="match-badge"></span>

            <span class="paper-date"></span>

            <span class="paper-source"></span>

          </div>


          <!-- Title -->
          <div class="paper-title-block">

            <h3 class="paper-title"></h3>

            <p class="paper-title-zh"></p>

          </div>


          <!-- Authors -->
          <p class="paper-authors"></p>


          <!-- Tags -->
          <div class="paper-tags"></div>


          <!-- =================================================
               AI Bilingual Analysis
               ================================================= -->

          <div class="analysis-heading">

            <div>

              <span class="analysis-kicker">
                AI Analysis
              </span>

              <h4>
                深度双语论文速览
              </h4>

            </div>

            <span
              class="analysis-language-hint"
              aria-label="英文与中文逐句对应"
            >
              EN ↔ 中文
            </span>

          </div>


          <dl class="summary-grid bilingual-summary-grid">


            <!-- Task / Research Direction Definition -->
            <div
              class="summary-item summary-item-wide task-summary-item"
              data-analysis-section="task_intro"
            >

              <dt>
                <span class="summary-label-en">
                  Task
                </span>

                <span class="summary-label-zh">
                  任务定义
                </span>
              </dt>

              <dd class="summary-task bilingual-lines"></dd>

            </div>


            <!-- Problem -->
            <div
              class="summary-item summary-item-wide problem-summary-item"
              data-analysis-section="problem"
            >

              <dt>
                <span class="summary-label-en">
                  Problem
                </span>

                <span class="summary-label-zh">
                  问题
                </span>
              </dt>

              <dd class="summary-problem bilingual-lines"></dd>

            </div>


            <!-- Method -->
            <div
              class="summary-item summary-item-wide method-summary-item"
              data-analysis-section="method"
            >

              <dt>
                <span class="summary-label-en">
                  Method
                </span>

                <span class="summary-label-zh">
                  方法
                </span>
              </dt>

              <dd class="summary-method bilingual-lines"></dd>

            </div>


            <!-- Model Figure -->
            <div
              class="summary-item summary-item-wide model-figure-summary-item"
              data-analysis-section="model_figure"
              hidden
            >

              <dt>
                <span class="summary-label-en">
                  Model Figure
                </span>

                <span class="summary-label-zh">
                  模型框架
                </span>
              </dt>

              <dd class="model-figure-container">

                <figure class="model-figure-card">

                  <a
                    class="model-figure-link"
                    target="_blank"
                    rel="noreferrer"
                    title="查看原始模型图"
                  >
                    <img
                      class="model-figure-image"
                      loading="lazy"
                      decoding="async"
                      alt="论文模型框架图"
                    />
                  </a>

                  <figcaption class="model-figure-caption">

                    <p
                      class="model-figure-caption-original"
                      lang="en"
                    ></p>

                    <p
                      class="model-figure-caption-zh"
                      lang="zh-CN"
                    ></p>

                    <div class="model-figure-meta">

                      <span class="model-figure-number"></span>

                      <span class="model-figure-page"></span>

                      <span class="model-figure-confidence"></span>

                    </div>

                  </figcaption>

                </figure>

              </dd>

            </div>


            <!-- Innovation -->
            <div
              class="summary-item summary-item-wide innovation-summary-item"
              data-analysis-section="innovation"
            >

              <dt>
                <span class="summary-label-en">
                  Innovation
                </span>

                <span class="summary-label-zh">
                  创新
                </span>
              </dt>

              <dd class="summary-innovation bilingual-lines"></dd>

            </div>


            <!-- Evidence -->
            <div
              class="summary-item evidence-summary-item"
              data-analysis-section="evidence"
            >

              <dt>
                <span class="summary-label-en">
                  Evidence
                </span>

                <span class="summary-label-zh">
                  证据
                </span>
              </dt>

              <dd class="summary-evidence bilingual-lines"></dd>

            </div>


            <!-- Limitations -->
            <div
              class="summary-item limitations-summary-item"
              data-analysis-section="limitations"
            >

              <dt>
                <span class="summary-label-en">
                  Limitations
                </span>

                <span class="summary-label-zh">
                  局限
                </span>
              </dt>

              <dd class="summary-limitations bilingual-lines"></dd>

            </div>


            <!-- Relevance -->
            <div
              class="summary-item relevance-summary-item"
              data-analysis-section="why_relevant"
            >

              <dt>
                <span class="summary-label-en">
                  Relevance
                </span>

                <span class="summary-label-zh">
                  与研究兴趣的匹配
                </span>
              </dt>

              <dd class="summary-relevant bilingual-lines"></dd>

            </div>

          </dl>

        </div>


        <!-- =================================================
             Footer
             ================================================= -->

        <footer class="paper-footer">


          <!-- Match Reason -->
          <span class="match-reason"></span>


          <!-- Reading State Actions -->
          <div
            class="paper-state-actions"
            aria-label="阅读状态操作"
          >

            <button
              class="state-btn read-btn"
              type="button"
              data-action="read"
              title="标记为已读"
            >
              <span aria-hidden="true">
                ✓
              </span>
              已读
            </button>

            <button
              class="state-btn favorite-btn"
              type="button"
              data-action="favorite"
              title="加入精选"
            >
              <span aria-hidden="true">
                ☆
              </span>
              精选
            </button>

            <button
              class="state-btn unread-btn"
              type="button"
              data-action="unread"
              title="取消当前状态并恢复为未读"
              hidden
            >
              <span aria-hidden="true">
                ↩
              </span>
              设为未读
            </button>

          </div>


          <!-- Links -->
          <div class="paper-links">

            <a
              class="paper-link abs-link"
              target="_blank"
              rel="noreferrer"
            >
              原文
            </a>

            <a
              class="paper-link pdf-link"
              target="_blank"
              rel="noreferrer"
            >
              PDF
            </a>

            <a
              class="paper-link download-link"
            >
              下载 PDF
            </a>

          </div>

        </footer>

      </article>

    </template>


    <!--
      修改版本号用于避免 GitHub Pages / 浏览器读取旧 JS。
    -->
    <script
      src="./app.js?v=20260909-paper-reader-v3"
    ></script>

  </body>
</html>
